name: Build Nexus.Tutor production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'config.js'
      - 'coordinates.js'
      - 'styles.css'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'scripts/build.mjs'
      - '.github/workflows/build-production.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Validate production output
        run: |
          test -f dist/index.html
          test -f dist/app.min.js
          test -f dist/config.min.js
          test -f dist/coordinates.min.js
          test -f dist/styles.min.css
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
          ! find dist -type f -name '*.map' | grep -q .
          ! test -f dist/app.js
          ! test -f dist/config.js
          ! test -f dist/coordinates.js
          ! test -f dist/styles.css
          grep -q 'app.min.js' dist/index.html
          grep -q 'config.min.js' dist/index.html
          grep -q 'coordinates.min.js' dist/index.html
          grep -q 'styles.min.css' dist/index.html

      - name: Commit dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          if git diff --cached --quiet; then
            echo 'dist sin cambios'
            exit 0
          fi
          git commit -m 'build: production dist minificado y ofuscado'
          git push

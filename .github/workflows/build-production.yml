name: Build Nexus.Tutor production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'config.js'
      - 'core/**'
      - 'services/**'
      - 'features/**'
      - 'ui/**'
      - 'css/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-production.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build production
        run: npm run build

      - name: Validate production output
        run: |
          test -f dist/index.html
          test -f dist/config.min.js
          test -f dist/runtime.min.js
          test -f dist/location.min.js
          test -f dist/app.min.js
          test -f dist/destinations.min.js
          test -f dist/shell.min.js
          test -f dist/foundation.min.css
          test -f dist/application.min.css
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
          ! find dist -type f -name '*.map' | grep -q .
          ! test -f dist/app.js
          ! test -f dist/config.js
          grep -q 'config.min.js' dist/index.html
          grep -q 'runtime.min.js' dist/index.html
          grep -q 'location.min.js' dist/index.html
          grep -q 'app.min.js' dist/index.html
          grep -q 'destinations.min.js' dist/index.html
          grep -q 'shell.min.js' dist/index.html
          grep -q 'foundation.min.css' dist/index.html
          grep -q 'application.min.css' dist/index.html

      - name: Commit dist
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          if git diff --cached --quiet; then
            echo 'dist sin cambios'
            exit 0
          fi
          git commit -m 'build: production dist minificado y ofuscado'
          git push

name: Build Nexus.Tutor production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'core/**'
      - 'services/**'
      - 'features/**'
      - 'ui/**'
      - 'css/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-production.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build production
        run: npm run build

      - name: Validate production output
        run: |
          set -euo pipefail
          for f in index.html gps.css gps-config.js gps.js tutor.html tutor.css tutor-health.css tutor-config.js pickup-time-contract.js tutor-observability.js tutor.js; do
            test -s "dist/$f" || { echo "::error::Missing dist/$f"; exit 1; }
          done
          test -d dist/labo1
          grep -q 'gps.js' dist/index.html
          grep -q 'tutor.js' dist/tutor.html
          ! find dist -type f -name '*.map' | grep -q .
      - name: Commit dist
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          if git diff --cached --quiet; then
            echo 'dist sin cambios'
            exit 0
          fi
          git commit -m 'build: production dist minificado y ofuscado'
          git push

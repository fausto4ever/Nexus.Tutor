name: Tutor - Pruebas unitarias

on:
  push:
    branches: ['refactor/0.1.9-structure']
    paths:
      - 'tests/unit/**'
      - 'services/**'
      - 'pickup-time-contract.js'
      - 'package.json'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: ['refactor/0.1.9-structure']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas del modulo
        run: npm run test:unit

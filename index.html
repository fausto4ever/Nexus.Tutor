<!doctype html>
<html lang="es" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f5f9"><title>Nexus.Tutor</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/nexus-tutor.css"></head>
<body>
<main class="app-shell">
<header class="topbar"><div class="brand-block"><div class="eyebrow">CONTROL DE ACCESO · v0.2.0</div><h1>Nexus.Tutor</h1></div><div class="topbar-actions"><span id="connectionBadge" class="badge badge-ok connection-badge">● Gateway</span><button id="themeToggleBtn" class="icon-btn" type="button"><span id="themeIcon">☾</span></button></div></header>
<section class="card pickup-lab">
<div class="pickup-lab-head"><div><span class="muted">RECOGIDA</span><strong id="flowInstance">Conectando…</strong></div><span class="badge badge-ok">LAB</span></div>
<div id="flowSetup">
<label class="muted" for="flowTutor">Tutor de prueba</label><select id="flowTutor"><option value="TUT0001">TUT0001</option><option value="TUT0002">TUT0002</option><option value="TUT0003">TUT0003</option><option value="TUT0004">TUT0004</option></select>
<div><span class="muted">Tutor</span><strong id="flowTutorName">—</strong></div>
<div><span class="muted">¿A quién recoges?</span><div id="flowStudents" class="student-choice-list"></div></div>
<div><span class="muted">¿Cómo vienes?</span><div class="student-choice-list"><label class="student-choice"><input type="radio" name="pickupMode" value="GPS" checked><span class="student-choice-body"><strong>GPS</strong><small>Seguimiento por ubicación</small></span></label><label class="student-choice"><input type="radio" name="pickupMode" value="ETA"><span class="student-choice-body"><strong>ETA</strong><small>Tiempo estimado de llegada</small></span></label></div></div>
<div id="etaOptions" hidden><label for="flowEta">Llegaré aproximadamente en</label><select id="flowEta"><option value="5">5 minutos</option><option value="10" selected>10 minutos</option><option value="15">15 minutos</option><option value="20">20 minutos</option><option value="30">30 minutos</option></select></div>
<div class="action-zone"><button id="flowCreate" class="pickup-btn" type="button" disabled><span class="pickup-icon">⌖</span><span>VOY POR MIS HIJOS</span></button></div>
</div>
<div id="flowTracking" hidden>
<section class="status-card"><span class="muted">Estado de la solicitud</span><div id="flowStatus" class="status-pill status-outside">REQUESTED</div><div class="sync-row"><span>Distancia GPS</span><strong id="flowDistance">—</strong></div></section>
<section class="log-card card"><div class="section-title"><strong>Solicitudes</strong></div><div id="flowRequests" class="event-log"><div class="empty-log">Sin solicitud activa.</div></div></section>
<button id="flowReset" class="secondary-btn" type="button">Reiniciar prueba</button>
</div>
<p id="flowMessage" class="helper">Selecciona tutor, hijos y forma de recogida.</p>
</section>
<p class="helper"><a href="labo1/">Abrir laboratorio anterior</a></p>
</main>
<script src="config.js"></script><script src="services/location.js"></script><script src="services/distance.js"></script><script src="services/gateway-client.js"></script><script src="features/pickup-flow.js"></script><script src="ui/shell.js"></script>
</body></html>
